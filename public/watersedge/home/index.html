<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Home Projects | Waters Edge</title>
  <meta name="description" content="Room-by-room decorating, furnishing, and small projects for 6506 Waters Edge Way." />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <meta name="theme-color" content="#0A1628" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,500&family=Inter:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="hp-head">
    <div class="hp-head-in">
      <a class="hp-back" href="/watersedge">Waters Edge</a>
      <h1 class="hp-title"><a href="#/">Home Projects</a></h1>
      <p class="hp-sub">6506 Waters Edge Way <span aria-hidden="true">&bull;</span> Lakewood Ranch</p>
    </div>
  </header>

  <nav class="hp-rooms" id="roomnav" aria-label="Rooms"></nav>

  <main id="main" class="hp-main" tabindex="-1">
    <p class="loading">Loading your rooms&hellip;</p>
  </main>

  <button class="fab" id="fab" type="button" data-act="quick-add" aria-label="Add an item or photos">
    <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
  </button>

  <dialog id="sheet" class="sheet" aria-label="Details"></dialog>
  <dialog id="lightbox" class="lightbox" aria-label="Photo"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input type="file" id="file" accept="image/*" multiple hidden />

  <script>window.HOME_API_BASE = "";</script>
  <script src="app.js"></script>
</body>
</html>
