name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Sync Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WATERSEDGE_PASSWORD: ${{ secrets.WATERSEDGE_PASSWORD }}
        run: |
          if [ -n "$WATERSEDGE_PASSWORD" ]; then
            printf '%s' "$WATERSEDGE_PASSWORD" | npx wrangler secret put WATERSEDGE_PASSWORD
          else
            echo "WATERSEDGE_PASSWORD repo secret not set; skipping"
          fi

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
