<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photo Library | Waters Edge</title>
  <meta name="description" content="Project photo library for 6506 Waters Edge Way. Inspiration, progress, and designer reference photos." />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <link rel="canonical" href="https://brendoslife.com/watersedge/photos" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Brendo's Life" />
  <meta property="og:title" content="Photo Library | Waters Edge" />
  <meta property="og:description" content="Project photo library for 6506 Waters Edge Way. Inspiration, progress, and designer reference photos." />
  <meta property="og:url" content="https://brendoslife.com/watersedge/photos" />
  <meta property="og:image" content="https://brendoslife.com/og-image.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Photo Library | Waters Edge" />
  <meta name="twitter:description" content="Project photo library for 6506 Waters Edge Way. Inspiration, progress, and designer reference photos." />

  <!-- Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ImageGallery",
    "name": "Waters Edge Photo Library",
    "description": "Project photo library for 6506 Waters Edge Way. Inspiration, progress, and designer reference photos.",
    "url": "https://brendoslife.com/watersedge/photos"
  }
  </script>

  <!-- Favicons -->
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <meta name="theme-color" content="#0A1628" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600&family=Inter:wght@400;500;600;700&display=swap" />

  <style>
    :root {
      --navy: #0A1628;
      --gold: #C4973B;
      --cream: #FBF9F4;
      --steel-blue: #3A6B8C;
      --body-blue: #1F4E8C;
      --line: #E5DFD2;
      --muted: #5A6478;
      --font-heading: Georgia, "Times New Roman", serif;
      --font-body: "Inter", system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body);
      background: var(--cream);
      color: var(--body-blue);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    /* Page header */
    .page-header {
      background: var(--navy);
      color: #FBF9F4;
      padding: 36px 24px;
      border-bottom: 4px solid var(--gold);
    }
    .page-header .inner {
      max-width: 1100px;
      margin: 0 auto;
    }
    .page-header h1 {
      font-family: var(--font-heading);
      font-size: 1.8rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    .page-header .sub {
      color: #aab4c4;
      font-size: 0.85rem;
      letter-spacing: 1px;
    }
    .page-header nav {
      margin-top: 14px;
      display: flex;
      gap: 18px;
      font-size: 0.82rem;
    }
    .page-header nav a {
      color: var(--gold);
      text-decoration: none;
      transition: color 0.15s;
    }
    .page-header nav a:hover { color: #e3c878; }

    /* Main content */
    .main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 24px 60px;
    }

    /* Upload section */
    .upload-section {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 24px;
      margin-bottom: 32px;
    }
    .upload-section h2 {
      font-family: var(--font-heading);
      font-size: 1.2rem;
      color: var(--navy);
      margin-bottom: 16px;
    }
    .upload-toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      background: var(--navy);
      color: #FBF9F4;
      border: none;
      border-radius: 4px;
      font-family: var(--font-body);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      min-height: 44px;
      min-width: 44px;
    }
    .upload-toggle:hover { background: #162a4a; }

    .upload-form {
      display: none;
      margin-top: 20px;
    }
    .upload-form.visible { display: block; }

    .form-group {
      margin-bottom: 14px;
    }
    .form-group label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--navy);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .form-group input[type="text"],
    .form-group input[type="password"] {
      width: 100%;
      max-width: 360px;
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 4px;
      font-size: 0.95rem;
      font-family: var(--font-body);
      color: var(--navy);
      min-height: 44px;
    }
    .form-group input[type="file"] {
      font-size: 0.9rem;
      min-height: 44px;
      padding: 8px 0;
    }
    .form-group input:focus {
      outline: 2px solid var(--steel-blue);
      outline-offset: 1px;
    }

    .submit-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      background: var(--gold);
      color: var(--navy);
      border: none;
      border-radius: 4px;
      font-family: var(--font-body);
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s;
      min-height: 44px;
      min-width: 44px;
    }
    .submit-btn:hover { background: #d4a94b; }
    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .upload-msg {
      margin-top: 12px;
      font-size: 0.88rem;
      padding: 10px 14px;
      border-radius: 4px;
      display: none;
    }
    .upload-msg.error {
      display: block;
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }
    .upload-msg.success {
      display: block;
      background: #f0fdf4;
      color: #166534;
      border: 1px solid #bbf7d0;
    }

    /* Gallery */
    .gallery-section h2 {
      font-family: var(--font-heading);
      font-size: 1.2rem;
      color: var(--navy);
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--gold);
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
    }

    .gallery-item {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
      cursor: pointer;
      transition: box-shadow 0.2s, transform 0.2s;
    }
    .gallery-item:hover {
      box-shadow: 0 4px 16px rgba(10, 22, 40, 0.12);
      transform: translateY(-2px);
    }
    .gallery-item img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      display: block;
    }
    .gallery-item-info {
      padding: 12px 14px;
    }
    .gallery-item-caption {
      font-size: 0.9rem;
      color: var(--navy);
      font-weight: 500;
    }
    .gallery-item-meta {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 4px;
    }

    .gallery-empty {
      text-align: center;
      padding: 48px 24px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    /* Comment count badge on gallery tile */
    .gallery-item-meta .cmt-count {
      display: inline-block;
      margin-left: 6px;
      padding: 1px 6px;
      background: var(--navy);
      color: var(--cream);
      border-radius: 10px;
      font-size: 0.7rem;
      font-weight: 600;
    }

    /* Lightbox */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10000;
      background: rgba(10, 22, 40, 0.96);
      align-items: stretch;
      justify-content: center;
      padding: 0;
      overflow-y: auto;
    }
    .lightbox.active { display: flex; }

    .lightbox-shell {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 60px 24px 40px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .lightbox-image-wrap {
      display: flex;
      justify-content: center;
    }
    .lightbox img {
      max-width: 100%;
      max-height: 70vh;
      object-fit: contain;
      border-radius: 4px;
      background: #000;
    }
    .lightbox-close {
      position: fixed;
      top: 16px;
      right: 20px;
      background: rgba(10,22,40,0.7);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      font-size: 1.6rem;
      cursor: pointer;
      min-width: 44px;
      min-height: 44px;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10001;
    }
    .lightbox-caption {
      color: #FBF9F4;
      font-size: 0.95rem;
      text-align: center;
      padding: 0 8px;
    }

    /* Comments panel inside lightbox */
    .comments-panel {
      background: var(--cream);
      border-radius: 8px;
      padding: 20px 22px 22px;
      color: var(--navy);
    }
    .comments-panel h3 {
      font-family: var(--font-heading);
      font-size: 1.05rem;
      color: var(--navy);
      margin-bottom: 14px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--gold);
    }
    .comments-list { display: flex; flex-direction: column; gap: 14px; }
    .comment {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 12px 14px;
    }
    .comment.reply {
      margin-left: 22px;
      background: #fbfaf6;
      border-left: 3px solid var(--gold);
    }
    .comment-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 4px;
    }
    .comment-author {
      font-weight: 700;
      color: var(--navy);
      font-size: 0.9rem;
    }
    .comment-time {
      color: var(--muted);
      font-size: 0.75rem;
    }
    .comment-body {
      color: var(--navy);
      font-size: 0.92rem;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .comment-actions {
      margin-top: 6px;
      display: flex;
      gap: 12px;
    }
    .comment-reply-btn {
      background: none;
      border: none;
      color: var(--steel-blue);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      padding: 2px 0;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .comment-reply-btn:hover { color: var(--navy); }

    .comment-form {
      margin-top: 16px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 12px 14px;
    }
    .comment-form.reply-form {
      margin: 8px 0 0 22px;
      background: #fbfaf6;
      border-left: 3px solid var(--gold);
    }
    .comment-form-row {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
    .comment-form label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--navy);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .comment-form select,
    .comment-form textarea {
      font-family: var(--font-body);
      font-size: 0.92rem;
      color: var(--navy);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 8px 10px;
    }
    .comment-form select { min-height: 40px; }
    .comment-form textarea {
      width: 100%;
      min-height: 70px;
      resize: vertical;
    }
    .comment-form-buttons {
      margin-top: 8px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .comment-submit {
      background: var(--gold);
      color: var(--navy);
      border: none;
      border-radius: 4px;
      padding: 8px 16px;
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      min-height: 40px;
    }
    .comment-submit:hover { background: #d4a94b; }
    .comment-submit:disabled { opacity: 0.6; cursor: not-allowed; }
    .comment-cancel {
      background: none;
      border: 1px solid var(--line);
      color: var(--muted);
      border-radius: 4px;
      padding: 8px 12px;
      font-family: var(--font-body);
      font-size: 0.82rem;
      cursor: pointer;
      min-height: 40px;
    }
    .comment-error {
      color: #991b1b;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 4px;
      padding: 8px 10px;
      font-size: 0.85rem;
      margin-top: 8px;
      display: none;
    }
    .comment-error.visible { display: block; }
    .comments-empty {
      color: var(--muted);
      font-size: 0.9rem;
      font-style: italic;
      padding: 4px 0 8px;
    }

    .loading-spinner {
      text-align: center;
      padding: 32px;
      color: var(--muted);
    }

    @media (max-width: 640px) {
      .gallery-grid {
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 10px;
      }
      .gallery-item img { height: 140px; }
      .page-header { padding: 24px 18px; }
      .main { padding: 20px 18px 48px; }
      .lightbox-shell { padding: 56px 14px 32px; }
      .comments-panel { padding: 16px 14px; }
      .comment.reply { margin-left: 12px; }
      .comment-form.reply-form { margin-left: 12px; }
    }
  </style>
</head>
<body>
  <header class="page-header">
    <div class="inner">
      <h1>Photo Library</h1>
      <div class="sub">6506 WATERS EDGE WAY &nbsp;&bull;&nbsp; LAKEWOOD RANCH</div>
      <nav>
        <a href="/watersedge">Back to Waters Edge</a>
        <a href="/watersedge/style">Style Guide</a>
      </nav>
    </div>
  </header>

  <main class="main">
    <!-- Upload Section -->
    <section class="upload-section" aria-label="Upload photos">
      <button class="upload-toggle" id="uploadToggle" type="button" aria-expanded="false" aria-controls="uploadForm">
        + Add Photos
      </button>

      <div class="upload-form" id="uploadForm" role="region" aria-label="Photo upload form">
        <form id="photoUploadForm" enctype="multipart/form-data">
          <div class="form-group">
            <label for="uploadFile">Photo (JPG, PNG, HEIC — max 15MB)</label>
            <input type="file" id="uploadFile" name="file" accept="image/jpeg,image/png,image/heic,image/heif,.heic,.heif" required />
          </div>
          <div class="form-group">
            <label for="uploadCaption">Caption (optional)</label>
            <input type="text" id="uploadCaption" name="caption" placeholder="e.g., Living room inspiration" />
          </div>
          <div class="form-group">
            <label for="uploadBy">Uploaded by (optional)</label>
            <input type="text" id="uploadBy" name="uploadedBy" placeholder="e.g., Brendan, Marcela, Designer" />
          </div>
          <button type="submit" class="submit-btn" id="submitBtn">Upload Photo</button>
        </form>
        <div class="upload-msg" id="uploadMsg"></div>
      </div>
    </section>

    <!-- Gallery Section -->
    <section class="gallery-section" aria-label="Photo gallery">
      <h2>Gallery</h2>
      <div id="galleryGrid" class="gallery-grid">
        <div class="loading-spinner">Loading photos...</div>
      </div>
    </section>
  </main>

  <!-- Lightbox with comments -->
  <div class="lightbox" id="lightbox" role="dialog" aria-label="Full-size photo viewer">
    <button class="lightbox-close" id="lightboxClose" aria-label="Close lightbox">&times;</button>
    <div class="lightbox-shell">
      <div class="lightbox-image-wrap">
        <img id="lightboxImg" src="" alt="" />
      </div>
      <div class="lightbox-caption" id="lightboxCaption"></div>

      <section class="comments-panel" aria-label="Photo discussion">
        <h3>Discussion</h3>
        <div id="commentsList" class="comments-list" aria-live="polite">
          <div class="comments-empty">Loading comments…</div>
        </div>

        <form id="commentForm" class="comment-form" autocomplete="off">
          <div class="comment-form-row">
            <label for="commentAuthor">Posting as</label>
            <select id="commentAuthor" name="author" required>
              <option value="">Choose…</option>
              <option value="Brendan">Brendan</option>
              <option value="Jessica">Jessica</option>
              <option value="Marcela">Marcela</option>
            </select>
          </div>
          <textarea id="commentBody" name="body" placeholder="Add a comment…" maxlength="2000" required></textarea>
          <div class="comment-form-buttons">
            <button type="submit" class="comment-submit" id="commentSubmit">Post comment</button>
          </div>
          <div class="comment-error" id="commentError" role="alert"></div>
        </form>
      </section>
    </div>
  </div>

  <script>
    (function () {
      const API_BASE = "/api/photos";
      const uploadToggle = document.getElementById("uploadToggle");
      const uploadForm = document.getElementById("uploadForm");
      const photoForm = document.getElementById("photoUploadForm");
      const uploadMsg = document.getElementById("uploadMsg");
      const submitBtn = document.getElementById("submitBtn");
      const galleryGrid = document.getElementById("galleryGrid");
      const lightbox = document.getElementById("lightbox");
      const lightboxImg = document.getElementById("lightboxImg");
      const lightboxCaption = document.getElementById("lightboxCaption");
      const lightboxClose = document.getElementById("lightboxClose");
      const commentsList = document.getElementById("commentsList");
      const commentForm = document.getElementById("commentForm");
      const commentAuthor = document.getElementById("commentAuthor");
      const commentBody = document.getElementById("commentBody");
      const commentSubmit = document.getElementById("commentSubmit");
      const commentError = document.getElementById("commentError");

      let currentPhotoId = null;
      let commentCounts = {}; // photoId -> count, refreshed after each load

      // Persist the last-used author across the session for convenience.
      try {
        const saved = localStorage.getItem("waters-edge-author");
        if (saved && ["Brendan", "Jessica", "Marcela"].includes(saved)) {
          commentAuthor.value = saved;
        }
      } catch (e) { /* ignore */ }

      function escapeHtml(s) {
        return String(s == null ? "" : s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function formatCommentTime(iso) {
        try {
          const d = new Date(iso);
          return d.toLocaleString("en-US", {
            month: "short", day: "numeric", year: "numeric",
            hour: "numeric", minute: "2-digit"
          });
        } catch (e) { return iso; }
      }

      // Toggle upload form
      uploadToggle.addEventListener("click", function () {
        const isVisible = uploadForm.classList.toggle("visible");
        uploadToggle.setAttribute("aria-expanded", isVisible ? "true" : "false");
      });

      // Load gallery
      async function loadGallery() {
        try {
          const res = await fetch(API_BASE);
          if (!res.ok) throw new Error("Failed to load photos");
          const photos = await res.json();

          if (photos.length === 0) {
            galleryGrid.innerHTML = '<div class="gallery-empty">No photos yet. Be the first to upload!</div>';
            return;
          }

          galleryGrid.innerHTML = photos.map(function (photo) {
            const date = new Date(photo.uploadedAt).toLocaleDateString("en-US", {
              month: "short", day: "numeric", year: "numeric"
            });
            const caption = photo.caption || photo.filename;
            const byLine = photo.uploadedBy ? " &bull; " + escapeHtml(photo.uploadedBy) : "";
            const count = commentCounts[photo.id] || 0;
            const badge = count > 0
              ? ' <span class="cmt-count" title="' + count + ' comment' + (count === 1 ? "" : "s") + '">\uD83D\uDCAC ' + count + '</span>'
              : '';
            return '<div class="gallery-item" data-id="' + photo.id + '" data-caption="' + escapeHtml(caption) + '">' +
              '<img src="' + API_BASE + '/thumb/' + photo.id + '" alt="' + escapeHtml(caption) + '" loading="lazy" width="240" height="200" />' +
              '<div class="gallery-item-info">' +
              '<div class="gallery-item-caption">' + escapeHtml(caption) + '</div>' +
              '<div class="gallery-item-meta">' + date + byLine + badge + '</div>' +
              '</div></div>';
          }).join("");

          // Attach click handlers for lightbox
          document.querySelectorAll(".gallery-item").forEach(function (item) {
            item.addEventListener("click", function () {
              const id = this.getAttribute("data-id");
              const caption = this.getAttribute("data-caption");
              openLightbox(id, caption);
            });
          });

          // Refresh comment counts in the background so badges show up.
          refreshCommentCounts(photos);
        } catch (err) {
          galleryGrid.innerHTML = '<div class="gallery-empty">Unable to load photos. Please try again later.</div>';
        }
      }

      async function refreshCommentCounts(photos) {
        try {
          const results = await Promise.all(photos.map(function (p) {
            return fetch(API_BASE + "/" + encodeURIComponent(p.id) + "/comments")
              .then(function (r) { return r.ok ? r.json() : []; })
              .then(function (list) { return { id: p.id, count: Array.isArray(list) ? list.length : 0 }; })
              .catch(function () { return { id: p.id, count: 0 }; });
          }));
          const nextCounts = {};
          results.forEach(function (r) { nextCounts[r.id] = r.count; });

          // Only re-render if any count actually changed.
          let changed = false;
          Object.keys(nextCounts).forEach(function (id) {
            if ((commentCounts[id] || 0) !== nextCounts[id]) changed = true;
          });
          commentCounts = nextCounts;

          if (changed) {
            document.querySelectorAll(".gallery-item").forEach(function (item) {
              const id = item.getAttribute("data-id");
              const meta = item.querySelector(".gallery-item-meta");
              if (!meta) return;
              const existing = meta.querySelector(".cmt-count");
              const count = commentCounts[id] || 0;
              if (existing) existing.remove();
              if (count > 0) {
                const span = document.createElement("span");
                span.className = "cmt-count";
                span.title = count + " comment" + (count === 1 ? "" : "s");
                span.textContent = "\uD83D\uDCAC " + count;
                meta.appendChild(document.createTextNode(" "));
                meta.appendChild(span);
              }
            });
          }
        } catch (e) { /* silent */ }
      }

      function openLightbox(id, caption) {
        currentPhotoId = id;
        lightboxImg.src = API_BASE + "/full/" + id;
        lightboxImg.alt = caption;
        lightboxCaption.textContent = caption;
        lightbox.classList.add("active");
        lightbox.scrollTop = 0;
        document.body.style.overflow = "hidden";
        commentBody.value = "";
        commentError.classList.remove("visible");
        commentError.textContent = "";
        loadComments(id);
      }

      async function loadComments(photoId) {
        commentsList.innerHTML = '<div class="comments-empty">Loading comments\u2026</div>';
        try {
          const res = await fetch(API_BASE + "/" + encodeURIComponent(photoId) + "/comments");
          if (!res.ok) throw new Error("Failed to load comments");
          const comments = await res.json();
          renderComments(comments);
          commentCounts[photoId] = comments.length;
        } catch (err) {
          commentsList.innerHTML = '<div class="comments-empty">Unable to load comments.</div>';
        }
      }

      function renderComments(comments) {
        if (!comments || comments.length === 0) {
          commentsList.innerHTML = '<div class="comments-empty">No comments yet. Start the discussion.</div>';
          return;
        }

        // Group into top-level + replies
        const topLevel = comments.filter(function (c) { return !c.parentId; });
        const repliesByParent = {};
        comments.forEach(function (c) {
          if (c.parentId) {
            (repliesByParent[c.parentId] = repliesByParent[c.parentId] || []).push(c);
          }
        });

        const html = topLevel.map(function (c) {
          const replies = repliesByParent[c.id] || [];
          const replyHtml = replies.map(function (r) {
            return (
              '<div class="comment reply" data-id="' + r.id + '">' +
                '<div class="comment-head">' +
                  '<span class="comment-author">' + escapeHtml(r.author) + '</span>' +
                  '<span class="comment-time">' + formatCommentTime(r.createdAt) + '</span>' +
                '</div>' +
                '<div class="comment-body">' + escapeHtml(r.body) + '</div>' +
              '</div>'
            );
          }).join("");

          return (
            '<div class="comment" data-id="' + c.id + '">' +
              '<div class="comment-head">' +
                '<span class="comment-author">' + escapeHtml(c.author) + '</span>' +
                '<span class="comment-time">' + formatCommentTime(c.createdAt) + '</span>' +
              '</div>' +
              '<div class="comment-body">' + escapeHtml(c.body) + '</div>' +
              '<div class="comment-actions">' +
                '<button type="button" class="comment-reply-btn" data-parent="' + c.id + '">Reply</button>' +
              '</div>' +
            '</div>' +
            replyHtml
          );
        }).join("");

        commentsList.innerHTML = html;

        // Wire reply buttons
        commentsList.querySelectorAll(".comment-reply-btn").forEach(function (btn) {
          btn.addEventListener("click", function () {
            showReplyForm(btn.getAttribute("data-parent"), btn);
          });
        });
      }

      function showReplyForm(parentId, btn) {
        // Remove any existing reply form
        const existing = document.querySelector(".reply-form");
        if (existing) existing.remove();

        const savedAuthor = commentAuthor.value || "";
        const form = document.createElement("form");
        form.className = "comment-form reply-form";
        form.setAttribute("autocomplete", "off");
        form.innerHTML =
          '<div class="comment-form-row">' +
            '<label>Replying as</label>' +
            '<select class="reply-author" required>' +
              '<option value="">Choose\u2026</option>' +
              '<option value="Brendan"' + (savedAuthor === "Brendan" ? " selected" : "") + '>Brendan</option>' +
              '<option value="Jessica"' + (savedAuthor === "Jessica" ? " selected" : "") + '>Jessica</option>' +
              '<option value="Marcela"' + (savedAuthor === "Marcela" ? " selected" : "") + '>Marcela</option>' +
            '</select>' +
          '</div>' +
          '<textarea class="reply-body" placeholder="Write a reply\u2026" maxlength="2000" required></textarea>' +
          '<div class="comment-form-buttons">' +
            '<button type="submit" class="comment-submit">Post reply</button>' +
            '<button type="button" class="comment-cancel">Cancel</button>' +
          '</div>' +
          '<div class="comment-error" role="alert"></div>';

        // Insert after the parent comment element
        const parentEl = btn.closest(".comment");
        if (parentEl && parentEl.parentNode) {
          parentEl.parentNode.insertBefore(form, parentEl.nextSibling);
        } else {
          commentsList.appendChild(form);
        }

        const authorSel = form.querySelector(".reply-author");
        const bodyTa = form.querySelector(".reply-body");
        const errBox = form.querySelector(".comment-error");
        const submitBtn = form.querySelector(".comment-submit");
        bodyTa.focus();

        form.querySelector(".comment-cancel").addEventListener("click", function () {
          form.remove();
        });

        form.addEventListener("submit", async function (e) {
          e.preventDefault();
          errBox.classList.remove("visible");
          errBox.textContent = "";
          const author = authorSel.value;
          const body = bodyTa.value.trim();
          if (!author) { showError(errBox, "Please choose who you're replying as."); return; }
          if (!body) { showError(errBox, "Reply cannot be empty."); return; }

          submitBtn.disabled = true;
          submitBtn.textContent = "Posting\u2026";
          try {
            const res = await fetch(API_BASE + "/" + encodeURIComponent(currentPhotoId) + "/comments", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ author: author, body: body, parentId: parentId })
            });
            const data = await res.json();
            if (!res.ok) {
              showError(errBox, data.error || "Unable to post reply.");
            } else {
              try { localStorage.setItem("waters-edge-author", author); } catch (e) {}
              form.remove();
              loadComments(currentPhotoId);
            }
          } catch (err) {
            showError(errBox, "Network error. Please try again.");
          } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = "Post reply";
          }
        });
      }

      function showError(el, text) {
        el.textContent = text;
        el.classList.add("visible");
      }

      // Top-level comment submission
      commentForm.addEventListener("submit", async function (e) {
        e.preventDefault();
        commentError.classList.remove("visible");
        commentError.textContent = "";

        const author = commentAuthor.value;
        const body = commentBody.value.trim();
        if (!author) { showError(commentError, "Please choose who you're posting as."); return; }
        if (!body) { showError(commentError, "Comment cannot be empty."); return; }
        if (!currentPhotoId) return;

        commentSubmit.disabled = true;
        commentSubmit.textContent = "Posting\u2026";
        try {
          const res = await fetch(API_BASE + "/" + encodeURIComponent(currentPhotoId) + "/comments", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ author: author, body: body, parentId: null })
          });
          const data = await res.json();
          if (!res.ok) {
            showError(commentError, data.error || "Unable to post comment.");
          } else {
            try { localStorage.setItem("waters-edge-author", author); } catch (e) {}
            commentBody.value = "";
            loadComments(currentPhotoId);
          }
        } catch (err) {
          showError(commentError, "Network error. Please try again.");
        } finally {
          commentSubmit.disabled = false;
          commentSubmit.textContent = "Post comment";
        }
      });

      // Close lightbox
      function closeLightbox() {
        lightbox.classList.remove("active");
        lightboxImg.src = "";
        document.body.style.overflow = "";
        currentPhotoId = null;
        const stray = document.querySelector(".reply-form");
        if (stray) stray.remove();
        // Refresh badge counts on the gallery after closing.
        document.querySelectorAll(".gallery-item").forEach(function (item) {
          const id = item.getAttribute("data-id");
          const meta = item.querySelector(".gallery-item-meta");
          if (!meta) return;
          const existing = meta.querySelector(".cmt-count");
          const count = commentCounts[id] || 0;
          if (existing) existing.remove();
          if (count > 0) {
            const span = document.createElement("span");
            span.className = "cmt-count";
            span.title = count + " comment" + (count === 1 ? "" : "s");
            span.textContent = "\uD83D\uDCAC " + count;
            meta.appendChild(document.createTextNode(" "));
            meta.appendChild(span);
          }
        });
      }
      lightboxClose.addEventListener("click", closeLightbox);
      lightbox.addEventListener("click", function (e) {
        if (e.target === lightbox) closeLightbox();
      });
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && lightbox.classList.contains("active")) {
          closeLightbox();
        }
      });

      // Upload form submission
      photoForm.addEventListener("submit", async function (e) {
        e.preventDefault();
        uploadMsg.className = "upload-msg";
        uploadMsg.style.display = "none";
        uploadMsg.textContent = "";

        const fileInput = document.getElementById("uploadFile");
        const caption = document.getElementById("uploadCaption").value;
        const uploadedBy = document.getElementById("uploadBy").value;

        if (!fileInput.files || fileInput.files.length === 0) {
          showMsg("Please select a file.", "error");
          return;
        }

        const file = fileInput.files[0];
        if (file.size > 15 * 1024 * 1024) {
          showMsg("File is too large. Maximum size is 15MB.", "error");
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "Uploading...";

        try {
          const formData = new FormData();
          formData.append("file", file);
          formData.append("caption", caption);
          formData.append("uploadedBy", uploadedBy);

          const res = await fetch(API_BASE + "/upload", {
            method: "POST",
            body: formData,
          });

          const data = await res.json();

          if (!res.ok) {
            showMsg(data.error || "Upload failed. Please try again.", "error");
          } else {
            showMsg("Photo uploaded successfully!", "success");
            photoForm.reset();
            loadGallery();
          }
        } catch (err) {
          showMsg("Network error. Please check your connection and try again.", "error");
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = "Upload Photo";
        }
      });

      function showMsg(text, type) {
        uploadMsg.textContent = text;
        uploadMsg.className = "upload-msg " + type;
      }

      // Initial load
      loadGallery();
    })();
  </script>
</body>
</html>
