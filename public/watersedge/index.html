<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Waters Edge | Brendos Life</title>
  <meta name="description" content="Waters Edge project hub — style guide, photo library, and design resources for 6506 Waters Edge Way, Lakewood Ranch." />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <link rel="canonical" href="https://brendoslife.com/watersedge" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Brendo's Life" />
  <meta property="og:title" content="Waters Edge | Brendos Life" />
  <meta property="og:description" content="Waters Edge project hub — style guide, photo library, and design resources for 6506 Waters Edge Way." />
  <meta property="og:url" content="https://brendoslife.com/watersedge" />
  <meta property="og:image" content="https://brendoslife.com/og-image.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Waters Edge | Brendos Life" />
  <meta name="twitter:description" content="Waters Edge project hub — style guide, photo library, and design resources for 6506 Waters Edge Way." />

  <!-- Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebPage",
    "name": "Waters Edge",
    "description": "Waters Edge project hub — style guide, photo library, and design resources for 6506 Waters Edge Way, Lakewood Ranch.",
    "url": "https://brendoslife.com/watersedge"
  }
  </script>

  <!-- Favicons -->
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <meta name="theme-color" content="#0A1628" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;0,8..60,700;1,8..60,400&family=Inter:wght@400;500;600;700&display=swap" />

  <style>
    :root {
      --navy: #0A1628;
      --gold: #C4973B;
      --cream: #FBF9F4;
      --steel-blue: #3A6B8C;
      --body-blue: #1F4E8C;
      --border-light: rgba(212, 209, 202, 0.18);
      --text-primary: #f7f6f2;
      --text-muted: #b9b6ad;
      --font-heading: "Source Serif 4", Georgia, "Times New Roman", serif;
      --font-body: "Inter", system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      font-family: var(--font-body);
      background: var(--navy);
      color: var(--text-primary);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      background-image:
        radial-gradient(900px 500px at 75% 5%, rgba(196, 151, 59, 0.07), transparent 70%),
        radial-gradient(800px 500px at 10% 80%, rgba(58, 107, 140, 0.07), transparent 70%);
      min-height: 100vh;
    }

    .wrap {
      max-width: 1240px;
      margin: 0 auto;
      padding: 32px 40px 48px;
      display: flex;
      flex-direction: column;
      gap: 28px;
      min-height: calc(100vh - 64px);
      justify-content: center;
    }

    .welcome { max-width: 940px; }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      font-family: var(--font-body);
      font-size: 0.76rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 14px;
    }
    .eyebrow::before {
      content: "";
      width: 32px;
      height: 1px;
      background: var(--gold);
    }

    h1 {
      font-family: var(--font-heading);
      font-weight: 500;
      font-size: clamp(2.2rem, 4vw, 3.6rem);
      line-height: 1.08;
      letter-spacing: -0.015em;
      color: var(--text-primary);
      margin-bottom: 12px;
    }
    h1 em {
      font-style: italic;
      color: var(--gold);
      font-weight: 500;
    }

    .intro {
      font-size: 1rem;
      color: var(--text-muted);
      max-width: 60ch;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 640px;
    }

    .link-card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 20px;
      background: rgba(255, 255, 255, 0.025);
      border: 1px solid var(--border-light);
      border-radius: 4px;
      text-decoration: none;
      color: var(--text-primary);
      transition: all 220ms cubic-bezier(0.4, 0, 0.2, 1);
      min-height: 44px;
    }
    .link-card-icon {
      flex: 0 0 50px;
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(251, 249, 244, 0.92);
      border: 1px solid rgba(212, 209, 202, 0.25);
      border-radius: 8px;
      overflow: hidden;
    }
    .link-card-icon img {
      width: 38px;
      height: 38px;
      object-fit: contain;
      display: block;
    }
    .link-card:hover {
      background: rgba(196, 151, 59, 0.06);
      border-color: rgba(196, 151, 59, 0.45);
      transform: translateX(4px);
    }
    .link-card-text { display: flex; flex-direction: column; gap: 2px; flex: 1 1 auto; min-width: 0; }
    .link-card-title {
      font-family: var(--font-heading);
      font-weight: 500;
      font-size: 1.08rem;
      letter-spacing: -0.005em;
    }
    .link-card-host {
      font-family: var(--font-body);
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .link-card-arrow {
      font-family: var(--font-body);
      font-size: 1.2rem;
      color: var(--gold);
      transition: transform 220ms cubic-bezier(0.4, 0, 0.2, 1);
      line-height: 1;
    }
    .link-card:hover .link-card-arrow { transform: translateX(6px); }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      color: var(--text-muted);
      text-decoration: none;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-weight: 500;
      transition: color 0.15s;
    }
    .back-link:hover { color: var(--gold); }
    .back-link::before { content: "\2190"; }

    @media (max-width: 960px) {
      .wrap {
        padding: 24px 24px 48px;
        gap: 24px;
        min-height: 0;
        justify-content: flex-start;
      }
      h1 { font-size: clamp(2rem, 7vw, 2.8rem); }
    }
    @media (max-width: 480px) {
      .link-card { padding: 12px 16px; }
      .link-card-title { font-size: 1rem; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="welcome">
      <a class="back-link" href="/">Brendo's Life</a>
      <div class="eyebrow">Project Hub</div>
      <h1><em>Waters Edge</em></h1>
      <p class="intro">
        Design resources and project tools for 6506 Waters Edge Way, Lakewood Ranch.
      </p>
    </header>

    <nav class="links" aria-label="Waters Edge links">
      <a class="link-card" href="/watersedge/style">
        <span class="link-card-icon" aria-hidden="true">
          <img src="/watersedge/icon-lakewoodranch.png" alt="Lakewood Ranch icon — Waters Edge style guide" width="38" height="38" loading="lazy" />
        </span>
        <span class="link-card-text">
          <span class="link-card-title">Style Guide</span>
          <span class="link-card-host">Tailored Colonial — palette, furniture, textiles</span>
        </span>
        <span class="link-card-arrow" aria-hidden="true">&rarr;</span>
      </a>

      <a class="link-card" href="/watersedge/photos">
        <span class="link-card-icon" aria-hidden="true">
          <img src="/watersedge/icon-lakewoodranch.png" alt="Waters Edge photo library" width="38" height="38" loading="lazy" />
        </span>
        <span class="link-card-text">
          <span class="link-card-title">Photo Library</span>
          <span class="link-card-host">Inspiration, progress, and reference photos</span>
        </span>
        <span class="link-card-arrow" aria-hidden="true">&rarr;</span>
      </a>
    </nav>
  </main>
</body>
</html>
